<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Belmira · Mantenimiento</title>
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="apple-touch-icon" href="icono-app.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#ECF1F1;--surface:#FFFFFF;--surface-2:#DFE8E8;--ink:#13232A;--ink-2:#4A5D63;--line:#C7D4D5;
  --brand:#12454F;--brand-ink:#FFFFFF;--accent:#2F6FA0;--trout:#C2577A;--ok:#2E7D4F;--warn:#9A6500;--bad:#B3261E;--info:#2F6FA0;
  --ok-bg:#DDEFE3;--warn-bg:#F6E8C8;--bad-bg:#F7DAD7;--info-bg:#DCE7F1;
  --s1:#1F7A6A;--s2:#C2577A;--s3:#3D5FA8;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1719;--surface:#152226;--surface-2:#1D2E33;--ink:#E2ECEE;--ink-2:#9FB3B8;--line:#2C4046;
  --brand:#7FC3CF;--brand-ink:#0D1719;--accent:#8DBBE0;--trout:#EE93B2;--ok:#6CC593;--warn:#E3B04B;--bad:#F07167;--info:#8DBBE0;
  --ok-bg:#1C3628;--warn-bg:#3A2F14;--bad-bg:#3E1E1C;--info-bg:#1B2C3A;--s1:#62C7B3;--s2:#EE93B2;--s3:#86A6E8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1719;--surface:#152226;--surface-2:#1D2E33;--ink:#E2ECEE;--ink-2:#9FB3B8;--line:#2C4046;
  --brand:#7FC3CF;--brand-ink:#0D1719;--accent:#8DBBE0;--trout:#EE93B2;--ok:#6CC593;--warn:#E3B04B;--bad:#F07167;--info:#8DBBE0;
  --ok-bg:#1C3628;--warn-bg:#3A2F14;--bad-bg:#3E1E1C;--info-bg:#1B2C3A;--s1:#62C7B3;--s2:#EE93B2;--s3:#86A6E8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;line-height:1.1}
h2{font-size:1.75rem}h3{font-size:1.3rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 20px}
.top h1{font-size:1.55rem;padding-bottom:10px;display:flex;align-items:center;gap:10px}
.stripe{display:inline-block;width:26px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--trout),#E9A6BE)}
#pend{font-family:var(--font);font-size:.78rem;font-weight:600;background:var(--warn-bg);color:var(--warn);border:0;border-radius:99px;padding:3px 10px;cursor:pointer;display:none}
nav.desk{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end}
nav.desk a{color:inherit;text-decoration:none;padding:9px 11px 11px;white-space:nowrap;opacity:.8;border-bottom:3px solid transparent;font-weight:500;font-size:.93rem}
nav.desk a[aria-current="page"]{opacity:1;border-bottom-color:currentColor}
nav.desk a:hover{opacity:1}
nav.mob{display:none}
main{max-width:1240px;margin:0 auto;padding:20px 20px 60px}
@media (max-width:760px){
  nav.desk{display:none}
  .top h1{font-size:1.3rem}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  nav.mob{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.mob a,nav.mob button{border:0;background:none;color:var(--ink-2);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;font-size:.72rem;font-weight:600;cursor:pointer}
  nav.mob svg{width:22px;height:22px}
  nav.mob [aria-current="page"]{color:var(--brand)}
}
.sheet{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .35);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet>div{background:var(--surface);width:100%;border-radius:12px 12px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet a{display:block;padding:14px 12px;color:var(--ink);text-decoration:none;font-weight:600;border-bottom:1px solid var(--line)}
.muted{color:var(--ink-2)}.small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
@media (max-width:760px){.panel{padding:14px}}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.big{min-height:52px;font-size:1.05rem;width:100%}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.84rem;min-height:32px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
label.f .hint{font-weight:400;color:var(--ink-2);font-size:.8rem}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 10px;font-weight:400;font-size:1rem;min-width:0;min-height:42px}
label.f textarea{min-height:80px;resize:vertical}
input[data-r="warn"]{border-color:var(--warn)!important;background:var(--warn-bg)!important}
input[data-r="bad"]{border-color:var(--bad)!important;background:var(--bad-bg)!important}
input[data-r="ok"]{border-color:var(--ok)!important}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.fincas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:18px}
.finca{background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--line);border-radius:8px;padding:16px 18px;text-align:left;width:100%}
.finca[data-n="alta"]{border-left-color:var(--bad)}.finca[data-n="media"]{border-left-color:var(--warn)}.finca[data-n="ok"]{border-left-color:var(--ok)}
.finca .nm{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.finca .st{font-weight:600;margin:4px 0 10px}
.finca[data-n="alta"] .st{color:var(--bad)}.finca[data-n="media"] .st{color:var(--warn)}.finca[data-n="ok"] .st{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.kpi b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--ink-2)}
.hoy{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hoy.done{background:var(--ok-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.chip.alta,.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.media,.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
.alert{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.alert:first-child{border-top:0}
.alert .t{font-weight:600}
.alert .s{grid-column:2;font-size:.9rem}
.alert .s b{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:.82rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.layout-lotes{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout-lotes{grid-template-columns:1fr}.lotelist{max-height:40vh!important}}
.lotelist{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
.lotelist button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.lotelist button:hover{background:var(--surface-2)}
.lotelist button[aria-current="true"]{background:var(--brand);color:var(--brand-ink)}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-left:3px solid var(--line);padding:8px 0 12px 14px}
.tl li[data-t="tratamiento"]{border-left-color:var(--m-trat)}.tl li[data-t="necropsia"]{border-left-color:var(--m-nec)}
.tl li[data-t="laboratorio"]{border-left-color:var(--m-lab)}.tl li[data-t="muestreo"]{border-left-color:var(--ok)}.tl li[data-t="evaluacion"]{border-left-color:var(--brand)}.tl li[data-t="suplementacion"]{border-left-color:var(--warn)}
.tl .h{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tl dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:6px 0 0;font-size:.88rem}
.tl dt{color:var(--ink-2)}.tl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.big button{flex:1;font-family:var(--display);font-size:1.25rem;border-radius:8px;min-height:52px}
.dayctl{display:flex;align-items:center;gap:6px}
.dayctl input{flex:1}
.dayctl .btn{min-width:44px}
.estanque{display:grid;grid-template-columns:1fr 110px;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.estanque:first-of-type{border-top:0}
.estanque .lbl b{font-family:var(--display);font-size:1.2rem;font-weight:600}
.estanque input{font-size:1.25rem;text-align:center;border:1px solid var(--line);border-radius:6px;min-height:48px;background:var(--surface);width:100%}
.estanque select{grid-column:1/-1;border:1px solid var(--line);border-radius:6px;min-height:40px;background:var(--surface);padding:6px 8px}
.estanque .who{grid-column:1/-1;font-size:.78rem;color:var(--ink-2);margin-top:-4px}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 4px;z-index:4}
@media (max-width:760px){.savebar{bottom:calc(62px + env(safe-area-inset-bottom,0px))}}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--ink-2);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 8px;border-radius:4px;max-width:240px;z-index:3;display:none;line-height:1.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}
.heat td{text-align:center;font-variant-numeric:tabular-nums;min-width:52px}
.corr td.c{text-align:center;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;z-index:40;display:none;max-width:min(92vw,520px);text-align:center}
.ai-out{line-height:1.6}
.ai-out h4{font-family:var(--display);font-size:1.25rem;margin:18px 0 6px;font-weight:600}
.ai-out ul{margin:4px 0;padding-left:20px}
.banner{background:var(--warn-bg);color:var(--ink);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.banner.info{background:var(--info-bg)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.score{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}
.adj{display:flex;flex-wrap:wrap;gap:10px}
.adj-it{display:flex;flex-direction:column;gap:4px;width:112px;font-size:.78rem;overflow-wrap:anywhere}
.adj img{width:112px;height:92px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.adj-pdf{display:flex;align-items:center;justify-content:center;width:112px;height:92px;border:1px solid var(--line);border-radius:6px;font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--bad);text-decoration:none;background:var(--surface-2)}
.adj-box{border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:14px}
.adj-box.falta{border-color:var(--warn);background:var(--warn-bg)}
.login{position:fixed;inset:0;z-index:50;background:var(--brand);display:flex;align-items:center;justify-content:center;padding:20px}
.login[hidden]{display:none}
.login-card{background:var(--surface);color:var(--ink);border-radius:12px;padding:28px 24px;width:min(420px,100%)}
.login-t{font-size:2.2rem;display:flex;align-items:center;gap:12px}
.login-card .stack>*+*{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:6px 0;font-weight:500}
.msg{font-size:.9rem;min-height:1.2em;margin:0}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Identidad Truchas Belmira ===== */
:root{--m-trat:#7A4F9E;--m-nec:#C0702A;--m-lab:#B3266E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-trat:#B99AE0;--m-nec:#E6A564;--m-lab:#EE8AB8}}
:root[data-theme="dark"]{--m-trat:#B99AE0;--m-nec:#E6A564;--m-lab:#EE8AB8}
:root{--bg:#F4F6F3;--surface:#FFFFFF;--surface-2:#EEF2ED;--ink:#1E2B38;--ink-2:#5A6A70;--line:#DDE4DC;
 --brand:#2D4E7F;--brand-ink:#FFFFFF;--accent:#0085A5;--trout:#6E8572;--ok:#2E7D4F;--warn:#9A6200;--bad:#B3261E;--info:#0085A5;
 --ok-bg:#E2F0E6;--warn-bg:#F7EBD0;--bad-bg:#F8E1DE;--info-bg:#DCEFF4;--s1:#2D4E7F;--s2:#0085A5;--s3:#7A9180;--logo-ink:#064C81;
 --font:Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;--display:var(--font)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1821;--surface:#15222D;--surface-2:#1C2B38;--ink:#E5ECEF;--ink-2:#A3B1B8;--line:#293A48;
 --brand:#8DB0DE;--brand-ink:#0E1821;--accent:#4CC0DA;--trout:#A9BBAA;--ok:#6CC593;--warn:#E3B04B;--bad:#F07167;--info:#4CC0DA;
 --ok-bg:#1B3427;--warn-bg:#382E15;--bad-bg:#3B1F1E;--info-bg:#15303A;--s1:#8DB0DE;--s2:#4CC0DA;--s3:#A9BBAA;--logo-ink:#FFFFFF}}
:root[data-theme="dark"]{--bg:#0E1821;--surface:#15222D;--surface-2:#1C2B38;--ink:#E5ECEF;--ink-2:#A3B1B8;--line:#293A48;
 --brand:#8DB0DE;--brand-ink:#0E1821;--accent:#4CC0DA;--trout:#A9BBAA;--ok:#6CC593;--warn:#E3B04B;--bad:#F07167;--info:#4CC0DA;
 --ok-bg:#1B3427;--warn-bg:#382E15;--bad-bg:#3B1F1E;--info-bg:#15303A;--s1:#8DB0DE;--s2:#4CC0DA;--s3:#A9BBAA;--logo-ink:#FFFFFF}
body{font-size:15.5px}
h1,h2,h3{font-weight:700;letter-spacing:0}
body::before{background:var(--surface)}
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.top-in{align-items:center;padding-top:10px}
.top h1{font-size:1.15rem;font-weight:700;color:var(--ink-2);padding-bottom:10px;gap:12px}
.logo-wrap{display:block;flex:none;line-height:0}.logo-oscuro{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-claro{display:none!important}:root:not([data-theme="light"]) .logo-oscuro{display:block!important}}
:root[data-theme="dark"] .logo-claro{display:none!important}:root[data-theme="dark"] .logo-oscuro{display:block!important}.logo{display:block;height:34px;width:auto}
.top h1 .app-t{padding-left:12px;border-left:1px solid var(--line);line-height:1.3}
nav.desk{align-self:flex-end}
nav.desk a{color:var(--ink-2);opacity:1;font-weight:600}
nav.desk a:hover{color:var(--brand)}
nav.desk a[aria-current="page"]{color:var(--brand);border-bottom-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.1)}
.panel,.finca{box-shadow:0 1px 2px rgb(30 43 56 / .05)}
.finca .nm{font-size:2rem;color:var(--brand)}
.kpi b{font-size:1.55rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg.big button{font-size:1.2rem;font-weight:700}
.login{background:linear-gradient(160deg,var(--bg) 0%,var(--surface-2) 100%)}
.login-card{box-shadow:0 12px 40px rgb(30 43 56 / .10);border:1px solid var(--line);padding:34px 28px}
.login-t{flex-direction:column;align-items:flex-start;gap:16px;font-size:1.3rem;color:var(--ink-2)}
.login-t .logo{height:56px}
nav.desk{flex:1 1 100%;justify-content:flex-start;margin-left:-11px}
.layout-lotes>*,.grid2>*,.fincas>*{min-width:0}
.layout-lotes aside .inp{width:100%}
@media (max-width:760px){.seg.tipos{display:grid;grid-template-columns:1fr 1fr}.seg.tipos button{border-radius:8px;padding:9px 6px;line-height:1.2}.lotelist{max-height:32vh!important}}
.finca{cursor:pointer}.finca[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.grupo-al{margin:16px 0 2px;font-size:1.1rem;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px}
details.avisos summary{color:var(--ink-2);font-weight:600;padding:8px 0}
details.mas{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.mas summary{color:var(--accent);font-weight:700;padding:8px 0;font-size:.95rem}
.dayctl .btn{font-size:1.5rem;line-height:1;padding:4px 12px;font-weight:400}
.top h1{padding-bottom:0}
@media (max-width:760px){.logo{height:28px}.top h1{font-size:1rem;padding-bottom:8px}.top-in{padding:8px 14px 0}.seg.big button{font-size:1.02rem;padding:8px 6px;line-height:1.15}.fincas{gap:12px}.finca .nm{font-size:1.75rem}}
/* ===== ERP: pantalla de módulos ===== */
.mod-card{width:min(480px,100%)}
.mod-list{display:flex;flex-direction:column;gap:12px}
.mod-it{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}

const IDB={p:null,open(){return this.p||(this.p=withTimeout(new Promise((res,rej)=>{const r=indexedDB.open("belmira",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("bloqueada"))}),4000).catch(e=>{this.p=null;throw e}))},

/* Datos: carga lo guardado en el equipo y baja solo lo que cambió (igual que Sanidad). */
function makeDb(sb){const cols=new Map(),CK="cache:",saveT={};
 const saveCache=n=>{clearTimeout(saveT[n]);saveT[n]=setTimeout(()=>{const c=cols.get(n);IDB.set(CK+n,{u:S.me.id,t:c.t||null,rev:c.rev||0,docs:[...c.docs]})},1500)};
 const emit=(n,cache)=>{const c=cols.get(n);c.subs.forEach(f=>{try{f()}catch(e){console.error(e)}});if(!cache)saveCache(n)};
 async function pages(q){const out=[];for(let from=0;;from+=1000){const{data,error}=await q().range(from,from+999);if(error)throw dbErr(error);out.push(...data);if(data.length<1000)break}return out}
 const sel="id,data,actualizado";
 const fetchAll=n=>pages(()=>sb.from("documentos").select(sel).eq("coleccion",n));
 /* Margen de 2 minutos: si dos personas guardan casi al mismo tiempo, ningún cambio se pierde. */
 const fetchSince=(n,t)=>pages(()=>sb.from("documentos").select(sel).eq("coleccion",n).gte("actualizado",new Date(Date.parse(t)-120000).toISOString()));
 const fetchIds=n=>pages(()=>sb.from("documentos").select("id").eq("coleccion",n));
 async function fetchByIds(n,ids){const out=[];for(let i=0;i<ids.length;i+=100){const{data,error}=await sb.from("documentos").select(sel).eq("coleccion",n).in("id",ids.slice(i,i+100));if(error)throw dbErr(error);out.push(...data)}return out}
 const marca=(c,rows)=>{for(const r of rows)if(r.actualizado&&(!c.t||r.actualizado>c.t))c.t=r.actualizado};

  try{if(c.t){const revisar=Date.now()-(c.rev||0)>864e5;const[ch,ids]=await withTimeout(Promise.all([fetchSince(n,c.t),revisar?fetchIds(n):null]),25000);
    if(ids){const vivos=new Set(ids.map(r=>r.id));for(const k of [...c.docs.keys()])if(!vivos.has(k))c.docs.delete(k);c.rev=Date.now();
     const faltan=[...vivos].filter(i=>!c.docs.has(i)&&!ch.some(r=>r.id===i));if(faltan.length){const fx=await withTimeout(fetchByIds(n,faltan),25000);for(const r of fx)c.docs.set(r.id,r.data);marca(c,fx)}}
    for(const r of ch)c.docs.set(r.id,r.data);marca(c,ch);
   }
   else{const rows=await withTimeout(fetchAll(n),25000);c.docs=new Map(rows.map(r=>[r.id,r.data]));marca(c,rows);c.rev=Date.now()}

  catch(e){c.err=dbErr(e);if(c.loaded){if(!S.avisoOffline){S.avisoOffline=true;toast("Sin conexión: se muestran los últimos datos guardados en este equipo.",6000)}setTimeout(()=>load(n),30000)}else emit(n,true)}}

 return{col,
  on(n,f){col(n).subs.add(f)},
  docs(n){return col(n).docs},

  async set(n,id,data){const{error}=await sb.from("documentos").upsert({coleccion:n,id,data});if(error)throw dbErr(error);col(n).docs.set(id,data);emit(n)},
  /* Pedido nuevo: "insert" para que dos pedidos nunca tomen el mismo número */
  async insert(n,id,data){const{error}=await sb.from("documentos").insert({coleccion:n,id,data});if(error)throw dbErr(error);col(n).docs.set(id,data);emit(n)},
  async siguiente(){const{data,error}=await sb.rpc("siguiente_mant");if(error)throw dbErr(error);if(!(+data>0))throw{message:"No se pudo asignar el número de la solicitud."};return+data},
  async fresco(n,id){const{data,error}=await sb.from("documentos").select("id,data,actualizado").eq("coleccion",n).in("id",[id]);if(error)throw dbErr(error);const r=data[0];if(r)col(n).docs.set(r.id,r.data);return r?.data},
  async historial(n,id){const{data,error}=await sb.rpc("historial_doc",{p_col:n,p_id:id});if(error)throw dbErr(error);return data||[]},
  async setMany(n,rows,prog){for(let i=0;i<rows.length;i+=200){const part=rows.slice(i,i+200);const{error}=await sb.from("documentos").upsert(part.map(r=>({coleccion:n,id:r.id,data:r.data})));if(error)throw dbErr(error);

}

const MANTA=(()=>{

  const fm=finMes(y,m+1+off),ini=fm.slice(0,8)+"01",H=[];for(let f=ini;f<=fm;f=addD(f,1)){const wd=new Date(f+"T12:00:00Z").getUTCDay();if(wd>0&&wd<6)H.push(f)}
  const k=(+String(cod||"").replace(/\D/g,"")||0)*7+(+String(p.id||"").replace(/\D/g,"")||0)*3;return H[k%H.length]}
 const estado=o=>{if(o.anulada)return"anulada";if(o.recibido?.ok)return"cerrada";if(o.terminado)return"por-recibir";if(o.espera&&!o.espera.fin)return"en-espera";if(o.rondas?.length&&!o.terminado&&!o.inicio2)return o.asignado?"devuelta":"nueva";if(o.inicio)return"en-proceso";if(o.asignado)return"asignada";return"nueva"};
 return function(O,E,I,MV,nombre,P){P=P||30;const h=hoyF(),a0=addD(h,-P+1),p0=addD(h,-2*P+1),p1=addD(h,-P),d90=addD(h,-89),nom=nombre||(x=>x||"—");
  const eqN=c=>E.get(c)?.nombre||c;const L=[...O].filter(([,o])=>!o.anulada);const malo=[],bueno=[],al=[];
  const corr=L.filter(([,o])=>o.tipo!=="preventivo");const abiertas=L.filter(([,o])=>!["cerrada","anulada"].includes(estado(o)));

  const porEq=new Map(),porLug=new Map();for(const[id,o]of corr){if((o.fecha||"")<d90)continue;if(o.equipo)(porEq.get(o.equipo)||porEq.set(o.equipo,[]).get(o.equipo)).push([id,o]);else if(o.lugar){const k=o.lugar.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim().split(" ").slice(0,3).join(" ");(porLug.get(k)||porLug.set(k,[]).get(k)).push([id,o])}}

   const espaciado=fr.length&&fr.every(f=>["bimestral","trimestral","semestral","anual"].includes(f));
   al.push({nivel:arr.length>=5?"alta":"media",tipo:"repetido",eq:c,ids:arr.map(x=>x[0]),texto:`${eqN(c)}: ${arr.length} correctivos en 90 días (el último el ${fe(ult)}).`,

  for(const[id,o]of abiertas){const e=estado(o),t0=Date.parse(o.creada||o.fecha),hh=horas(Date.now()-t0);
   if(o.prioridad==="critica"&&!o.inicio&&hh>4)al.push({nivel:"alta",tipo:"critica",ids:[id],texto:`${id} es crítica y lleva ${Math.round(hh)} horas sin atenderse (${o.equipo?eqN(o.equipo):o.lugar}).`,propuesta:e==="nueva"?"Asignar un técnico ya.":"Confirmar con el técnico asignado cuándo la atiende."});

   if(o.inocuidad&&!o.terminado&&dias(o.fecha,h)>2)al.push({nivel:"alta",tipo:"inocuidad",ids:[id],texto:`${id} puede afectar la inocuidad y lleva ${dias(o.fecha,h)} días abierta.`,propuesta:"Priorizarla e informar a Calidad mientras se resuelve."})}
  const resp=(f0,f1,soloCrit)=>{const v=[];for(const[,o]of L){if(o.tipo==="preventivo"||!o.inicio)continue;if(soloCrit&&o.prioridad!=="critica")continue;const f=(o.fecha||"");if(f<f0||f>f1)continue;v.push(horas(Date.parse(o.inicio.fecha)-Date.parse(o.creada||o.fecha)))}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const sol=(f0,f1)=>{const v=[];for(const[,o]of L){if(o.tipo==="preventivo"||!o.terminado)continue;const f=(o.fecha||"");if(f<f0||f>f1)continue;v.push(horas(Date.parse(o.terminado.fecha)-Date.parse(o.creada||o.fecha)))}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const rC=resp(a0,h,true),rT=resp(a0,h),sT=sol(a0,h),sTP=sol(p0,p1);
  if(rC!=null)(rC<=2?bueno:rC>4?malo:bueno).push(`Las solicitudes críticas se empiezan a atender en ${rC<1?Math.round(rC*60)+" minutos":Math.round(rC*10)/10+" horas"} en promedio.`);
  /* 5) Preventivos: vencidos y cumplimiento del mes anterior */
  const ult=(c,pid)=>{let u=null;for(const[,o]of L)if(o.prev&&o.prev.eq===c&&o.prev.plan===pid&&o.terminado){const f=o.terminado.fecha.slice(0,10);if(!u||f>u)u=f}return u};

  for(const[c,e]of E){if(e.estado!=="activo")continue;for(const p of e.plan||[]){if(!CAL.includes(p.frec))continue;const u=ult(c,p.id),prox=noDomA(u?sumar(u,p.frec):primera(p,c,h));

  const cumpl=progMP?Math.min(100,Math.round(hechoMP/progMP*100)):null;if(cumpl!=null)(cumpl>=80?bueno:malo).push(`Cumplimiento del cronograma el mes pasado: ${cumpl} % (${hechoMP} de ${progMP}).`);

const COLM={ord:"mant_ordenes",eq:"mant_equipos",inv:"mant_inventario",mov:"mant_movs",pre:"mant_prestamos",cfg:"mant_config"};
const ROLM={admin:"Administrador",director:"Dirección de mantenimiento",jefe:"Jefe de mantenimiento",tecnico:"Técnico",solicitante:"Solicita",lector:"Consulta"};
const PRIO={critica:["Crítica","bad",0],media:["Media","warn",1],baja:["Baja","info",2]};
const TIPO={correctivo:"Correctivo",locativo:"Locativo",preventivo:"Preventivo"};
const EST={nueva:["Nueva","warn",1],asignada:["Asignada","info",2],"en-proceso":["En proceso","info",3],"en-espera":["En espera","warn",4],devuelta:["Devuelta","bad",3],"por-recibir":["Por recibir","ok",5],cerrada:["Cerrada","",6],anulada:["Anulada","",7]};
const FREC={diaria:["Diaria",1,"d"],semanal:["Semanal",7,"d"],quincenal:["Quincenal",15,"d"],mensual:["Mensual",1,"m"],"45dias":["Cada mes y medio",45,"d"],bimestral:["Bimestral",2,"m"],trimestral:["Trimestral",3,"m"],semestral:["Semestral",6,"m"],anual:["Anual",12,"m"]};
const CALF=["mensual","45dias","bimestral","trimestral","semestral","anual"];/* van al calendario; diaria, semanal y quincenal son rutinas */
const AREAS=["Productos naturales","Valor agregado","Instalaciones","Utensilios","Instalaciones de cultivo","Otros"];
const fecha=f=>f?f.slice(8,10)+"/"+f.slice(5,7)+"/"+f.slice(0,4):"—";
const hoy=()=>new Date(Date.now()-5*36e5).toISOString().slice(0,10);
const ahora=()=>new Date().toISOString();
const fh=t=>{if(!t)return"—";const d=new Date(t);return d.toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit",timeZone:"America/Bogota"})};
const durTxt=ms=>{if(ms==null||ms<0)return"—";const h=ms/36e5;return h<1?Math.max(1,Math.round(ms/6e4))+" min":h<48?(Math.round(h*10)/10)+" h":Math.round(h/24)+" días"};
const addD=(f,n)=>{const d=new Date(f+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const finMes=(y,m)=>new Date(Date.UTC(y,m+1,0)).toISOString().slice(0,10);
const addM=(f,n)=>{const y=+f.slice(0,4),m=+f.slice(5,7)-1,d=+f.slice(8,10);const fm=finMes(y,m+n);return(d>=28?fm:fm.slice(0,8)+String(Math.min(d,+fm.slice(8))).padStart(2,"0"))};
const sumar=(f,fr)=>{const F=FREC[fr];return F[2]==="m"?addM(f,F[1]):addD(f,F[1])};
/* Decisión de Gerencia: ningún preventivo se programa en domingo; pasa al lunes */
const noDom=f=>f&&new Date(f+"T12:00:00Z").getUTCDay()===0?addD(f,1):f;
const ME=()=>String(S.me.email||"").toLowerCase();
const persona=e=>S.equipo.get(String(e||"").toLowerCase())?.nombre||e||"—";
const ords=()=>DB.docs(COLM.ord),eqs=()=>DB.docs(COLM.eq),items=()=>DB.docs(COLM.inv);
const centros=()=>(DB.docs("compras_config").get("centros")?.lista)||[];
const ccNom=id=>centros().find(c=>c.id===id)?.nombre||id||"—";
const eqNom=c=>eqs().get(c)?.nombre||c||"";
const tecnicos=()=>[...S.equipo.values()].filter(p=>p.rol==="tecnico"||p.rol==="jefe").sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
function estadoM(o){if(o.anulada)return"anulada";if(o.recibido?.ok)return"cerrada";if(o.terminado)return"por-recibir";
 if(o.espera&&!o.espera.fin)return"en-espera";if(o.rondas?.length&&!o.terminado&&!o.inicio2)return o.asignado?"devuelta":"nueva";if(o.inicio)return"en-proceso";if(o.asignado)return"asignada";return"nueva"}
const chipE=e=>`<span class="chip ${EST[e][1]}">${EST[e][0]}</span>`;
const chipP=p=>p?`<span class="chip ${PRIO[p][1]}">${PRIO[p][0]}</span>`:"";
const lugar=o=>o.equipo?eqNom(o.equipo):(o.lugar||"—");
const abierta=o=>!["cerrada","anulada"].includes(estadoM(o));

/* ---------- Inventario: la existencia se calcula con entradas, ajustes, consumos y préstamos ---------- */
function stock(){const M=new Map();const g=k=>M.get(k)||M.set(k,{ent:0,cons:0,prest:0,movs:[]}).get(k);
 for(const[id,m]of DB.docs(COLM.mov)){const x=g(m.item);x.ent+=(+m.cant||0);x.movs.push({...m,id})}
 for(const[id,o]of ords()){if(o.anulada)continue;for(const u of o.insumos||[]){const x=g(u.item);x.cons+=(+u.cant||0);x.movs.push({tipo:"consumo",cant:-(+u.cant||0),fecha:u.fecha,por:u.por,ord:id})}}
 for(const[,p]of DB.docs(COLM.pre)){if(!p.devuelto){g(p.item).prest+=(+p.cant||1)}}
 for(const[k,it]of items()){const x=g(k);x.exist=x.ent-x.cons;x.disp=it.tipo==="herramienta"?x.exist-x.prest:x.exist;x.bajo=it.minimo!=null&&it.minimo!==""&&x.disp<=+it.minimo}
 return M}

/* ---------- Cronograma ---------- */
function ultimoHecho(cod,pid){let u=null;for(const[,o]of ords()){if(o.anulada||!o.prev||o.prev.eq!==cod||o.prev.plan!==pid||!o.terminado)continue;const f=(o.terminado.fecha||"").slice(0,10);if(!u||f>u)u=f}return u}
function ordenAbierta(cod,pid){for(const[id,o]of ords())if(!o.anulada&&o.prev&&o.prev.eq===cod&&o.prev.plan===pid&&!o.terminado)return id;return null}
/* Primera fecha sugerida: desde el mes siguiente, repartida en los días hábiles para no amontonar todo el mismo día */
function primeraFecha(p,cod){if(p.prox)return p.prox;const h=hoy(),y=+h.slice(0,4),m=+h.slice(5,7)-1;const off={mensual:0,"45dias":0,bimestral:1,trimestral:2,semestral:5,anual:11}[p.frec]||0;
 const fm=finMes(y,m+1+off),ini=fm.slice(0,8)+"01",H=[];for(let f=ini;f<=fm;f=addD(f,1)){const wd=new Date(f+"T12:00:00Z").getUTCDay();if(wd>0&&wd<6)H.push(f)}
 const k=(+String(cod||"").replace(/\D/g,"")||0)*7+(+String(p.id||"").replace(/\D/g,"")||0)*3;return H[k%H.length]}
function programa(){const L=[];for(const[cod,e]of eqs()){if(e.estado!=="activo")continue;for(const p of e.plan||[]){if(!FREC[p.frec])continue;
  const u=ultimoHecho(cod,p.id),base=u?sumar(u,p.frec):primeraFecha(p,cod),prox=noDom(base),abierta=ordenAbierta(cod,p.id);L.push({cod,e,p,ult:u,base,prox,abierta,cal:CALF.includes(p.frec)})}}
 return L.sort((a,b)=>a.prox.localeCompare(b.prox))}
function ocurrencias(it,desde,hasta){const out=[];let f=it.base||it.prox,g=0;while(noDom(f)<desde&&g++<400)f=sumar(f,it.p.frec);while(noDom(f)<=hasta&&g++<800){out.push(noDom(f));f=sumar(f,it.p.frec)}if(it.prox<desde&&!it.abierta&&it.prox<hoy())out.unshift(it.prox);return out}
const anioProg=()=>{const h=hoy();return+h.slice(5,7)>=11?+h.slice(0,4)+1:+h.slice(0,4)};
const progAprob=a=>DB.docs(COLM.cfg).get("programa-"+a)?.aprobado;

/* ---------- Pendientes (campana) ---------- */
function pendientes(){const me=ME(),L=[];if(!DB.listo(COLM.ord))return L;
 for(const[id,o]of ords()){const e=estadoM(o);
  if(S.gestion&&e==="nueva")L.push([id,o.prioridad==="critica"?"Solicitud CRÍTICA: asignar técnico":"Asignar técnico"]);
  if(String(o.asignado||"").toLowerCase()===me&&["asignada","en-proceso","devuelta"].includes(e))L.push([id,e==="devuelta"?"Devuelta: no quedó bien":"Atender la solicitud"]);
  if(String(o.sol||"").toLowerCase()===me&&e==="por-recibir")L.push([id,"Confirma si quedó bien"])}
 if(S.gestion&&DB.listo(COLM.eq)){const v=programa().filter(x=>x.cal&&x.prox<hoy()&&!x.abierta).length;if(v)L.push(["CRON",`${v} preventivo${v>1?"s":""} vencido${v>1?"s":""}`])}
 if(S.gestion&&DB.listo(COLM.inv)&&DB.listo(COLM.mov)){const ST=stock(),b=[...items()].filter(([k,it])=>it.activo!==false&&ST.get(k)?.bajo).length;if(b)L.push(["INV",`${b} ítem${b>1?"s":""} bajo el mínimo`])}
 if(S.gestion&&DB.listo(COLM.eq)&&DB.listo(COLM.inv)&&DB.listo(COLM.mov)){const A=analisis().al.filter(a=>a.nivel==="alta").length;if(A)L.push(["ANA",`${A} alerta${A>1?"s":""} importante${A>1?"s":""} del análisis`])}
 if(S.rol==="director"||S.rol==="admin"){const a=anioProg();if(DB.listo(COLM.cfg)&&!progAprob(a)&&S.rol==="director")L.push(["PROG",`Aprobar el programa de mantenimiento ${a}`])}
 return L.sort((a,b)=>(/^MT/.test(a[0])?0:1)-(/^MT/.test(b[0])?0:1)||b[0].localeCompare(a[0]))}
function campana(){const b=$("#bell");if(!b||!DB||!DB.listo(COLM.ord))return;const n=pendientes().length;
 b.hidden=false;$("#bell-n").hidden=!n;$("#bell-n").textContent=n>99?"99+":String(n);document.title=(n?`(${n}) `:"")+"Belmira · Mantenimiento";try{n?navigator.setAppBadge?.(n):navigator.clearAppBadge?.()}catch(e){}}
const abrirPend=id=>{if(id==="ANA"){if(location.hash==="#analisis")render();else location.hash="analisis";return}if(id==="CRON"||id==="PROG"){if(location.hash==="#cronograma")render();else location.hash="cronograma";return}if(id==="INV"){S.inv.f="bajo";if(location.hash==="#inventario")render();else location.hash="inventario";return}if(ords().has(id))dlgOrden(id)};
const pendItem=([id,t])=>{const o=ords().get(id);return`<button class="pend-it" data-p="${id}"><b>${o?id:id==="INV"?"Inventario":id==="ANA"?"Análisis":"Cronograma"}</b><span>${esc(t)}</span><span class="muted small">${o?esc(lugar(o))+" · "+esc(persona(o.sol)):""}</span></button>`};
function verPendientes(){const P=pendientes();if(!P.length){toast("No tienes pendientes.");return}if(P.length===1){abrirPend(P[0][0]);return}
 const d=$("#dlg2");d.innerHTML=`<div class="dlg-h"><h3>Tus pendientes (${P.length})</h3></div><div class="dlg-b pend-lista">${P.map(pendItem).join("")}</div><div class="dlg-f"><button class="btn" id="pl-c">Cerrar</button></div>`;
 $("#pl-c").onclick=()=>d.close();d.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{d.close();abrirPend(x.dataset.p)});d.showModal()}

/* ---------- Navegación ---------- */
const VISTAS=[
 {id:"inicio",t:"Solicitudes",ic:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>'},
 {id:"cronograma",t:"Cronograma",ic:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',solo:"staff"},
 {id:"equipos",t:"Equipos",ic:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M7 13h10"/>',solo:"staff"},
 {id:"inventario",t:"Inventario",ic:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',solo:"staff"},
 {id:"analisis",t:"Análisis",ic:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',solo:"ana"}];
const vistas=()=>VISTAS.filter(v=>!v.solo||(v.solo==="ana"?(S.gestion||S.rol==="lector"):S.staff));
function pintarNav(){const V=vistas();$("#navm").style.gridTemplateColumns=`repeat(${V.length},1fr)`;$("#navm").style.display=V.length<2?"none":"";$("#navd").style.display=V.length<2?"none":"";
 $("#navd").innerHTML=V.map(v=>`<a href="#${v.id}"${S.vista===v.id?' aria-current="page"':""}>${v.t}</a>`).join("");
 $("#navm").innerHTML=V.map(v=>`<a href="#${v.id}"${S.vista===v.id?' aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">${v.ic}</svg>${v.t}</a>`).join("")}
function ir(){if(dlg.open)dlg.close();let h=location.hash.slice(1);if(/^MT-\d+$/.test(h)){S.abrir=h;history.replaceState(null,"","#inicio");h="inicio"}S.vista=vistas().some(v=>v.id===h)?h:"inicio";pintarNav();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",ir);
function cargando(...cs){const e=cs.map(c=>DB.error(c)).find(Boolean);if(e&&!cs.every(c=>DB.listo(c)))return`<div class="panel empty">${esc(e.message)} <button class="btn sm" onclick="location.reload()">Reintentar</button> <button class="btn sm" onclick="borrarLocal()">Borrar datos de este equipo</button></div>`;if(cs.every(c=>DB.listo(c))){S.cargIni=0;return""}
 if(!S.cargIni){S.cargIni=Date.now();setTimeout(()=>{try{if(!document.querySelector("dialog[open]"))render()}catch(e){}},20500)}
 if(Date.now()-S.cargIni>20000){const NOM={compras_ordenes:"pedidos",compras_articulos:"artículos",compras_proveedores:"proveedores",compras_config:"centros de costos",compras_cuentas:"cuentas bancarias",compras_pagos:"pagos",compras_evaluaciones:"evaluaciones",compras_historico:"histórico",mant_ordenes:"solicitudes",mant_equipos:"equipos",mant_inventario:"inventario",mant_movs:"movimientos",mant_prestamos:"préstamos",mant_config:"configuración"};
  return`<div class="panel empty"><b>Esto está tardando más de lo normal.</b><p class="muted small">No terminó de cargar: ${cs.filter(c=>!DB.listo(c)).map(c=>NOM[c]||c).join(", ")}. Revisa la señal; si sigue igual, borra los datos guardados en este equipo (tus datos siguen seguros en la base).</p><div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn sm" onclick="location.reload()">Reintentar</button><button class="btn sm" onclick="borrarLocal()">Borrar datos de este equipo</button></div></div>`}
 return'<div class="panel empty">Cargando…</div>'}
async function borrarLocal(){try{const d=await withTimeout(IDB.p||Promise.reject(),1000);d.close()}catch(e){}IDB.p=null;
 try{await withTimeout(new Promise(r=>{const q=indexedDB.deleteDatabase("belmira");q.onsuccess=q.onerror=q.onblocked=()=>r()}),3000)}catch(e){}
 try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
 location.reload()}
window.borrarLocal=borrarLocal;
function coincide(txt,q){if(!q)return true;const t=norm(txt);return norm(q).split(" ").every(p=>t.includes(p))}
/* Si algo falla al pintar la pantalla, se muestra el error (para poder diagnosticarlo con una captura) */
function render(){try{render0()}catch(e){console.error(e);const v=$("#view");if(v)v.innerHTML=`<div class="panel empty"><b>No se pudo mostrar esta pantalla.</b><p class="muted small">Error: ${esc(String(e&&e.message||e))}</p><div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn sm" onclick="location.reload()">Reintentar</button><button class="btn sm" onclick="borrarLocal()">Borrar datos de este equipo</button></div></div>`}}
window.addEventListener("error",e=>{try{if(e.message&&!/ResizeObserver|^Script error/i.test(e.message))toast("Error: "+e.message,8000)}catch(x){}});
window.addEventListener("unhandledrejection",e=>{try{const m=e.reason&&(e.reason.message||e.reason);if(m&&!/timeout|abort/i.test(String(m)))toast("Error: "+m,8000)}catch(x){}});
function render0(){setTimeout(()=>{if(S.sb)AV.pintar(S.sb,S.me.email,m=>toast(m,5000))},0);const v=$("#view");
 v.innerHTML=S.vista==="analisis"?vAnalisis():S.vista==="cronograma"?vCron():S.vista==="equipos"?vEquipos():S.vista==="inventario"?vInv():vSolicitudes();
 const fn={inicio:bindSol,cronograma:bindCron,equipos:bindEq,inventario:bindInv,analisis:bindAna}[S.vista];fn&&fn();campana()}

/* ---------- Solicitudes ---------- */
const FILT=[["abiertas","Abiertas"],["criticas","Críticas"],["sin-asignar","Sin asignar"],["mias","Asignadas a mí"],["en-espera","En espera"],["por-recibir","Por recibir"],["cerradas","Cerradas"],["todas","Todas"]];
function pasa(o,f){const e=estadoM(o),me=ME();switch(f){case"abiertas":return abierta(o);case"criticas":return abierta(o)&&o.prioridad==="critica";case"sin-asignar":return e==="nueva";case"mias":return abierta(o)&&String(o.asignado||"").toLowerCase()===me;
 case"en-espera":return e==="en-espera";case"por-recibir":return e==="por-recibir";case"cerradas":return e==="cerrada";default:return true}}
function vSolicitudes(){const w=cargando(COLM.ord,COLM.eq,"compras_config");if(w)return w;const f=S.fs;const P=pendientes();
 const filtros=FILT.filter(([k])=>S.staff||!["sin-asignar","mias","criticas"].includes(k)).filter(([k])=>k!=="mias"||S.rol==="tecnico"||S.gestion);
 const base=[...ords()].filter(([id,o])=>S.staff||String(o.sol||"").toLowerCase()===ME());
 const rows=base.filter(([id,o])=>pasa(o,f.est)&&coincide(`${id} ${lugar(o)} ${o.desc||""} ${persona(o.sol)} ${persona(o.asignado)} ${ccNom(o.cc)} ${TIPO[o.tipo]||""}`,f.q))
  .sort((a,b)=>(abierta(b[1])-abierta(a[1]))||(PRIO[a[1].prioridad||"baja"][2]-PRIO[b[1].prioridad||"baja"][2])||b[1].n-a[1].n);
 const fila=([id,o])=>{const e=estadoM(o);return`<tr data-o="${id}"><td class="mono"><b>${id}</b><span class="sub">${fecha(o.fecha)}</span></td><td>${esc(lugar(o))}<span class="sub">${esc(ccNom(o.cc))} · ${TIPO[o.tipo]||""}${o.inocuidad?" · inocuidad":""}</span></td>
  <td>${esc((o.desc||"").slice(0,90))}</td><td>${esc(persona(o.sol))}</td><td>${chipP(o.prioridad)}</td><td>${chipE(e)}${o.asignado?`<span class="sub">${esc(persona(o.asignado))}</span>`:""}</td></tr>`};
 const card=([id,o])=>{const e=estadoM(o);return`<button class="card-it" data-o="${id}"><div class="row" style="margin:0"><b>${id}</b>${chipP(o.prioridad)}${chipE(e)}</div><span class="ci-t">${esc(lugar(o))}</span><span class="muted small">${esc((o.desc||"").slice(0,80))}</span><div class="row"><span>${fecha(o.fecha)}</span><span>${esc(persona(o.sol))}</span>${o.asignado?`<span>→ ${esc(persona(o.asignado))}</span>`:""}</div></button>`};
 const lim=rows.slice(0,S.limS);
 return`<div class="row hrow"><h2 style="color:var(--brand)">Solicitudes de mantenimiento</h2><span class="spacer"></span>${S.rol==="lector"?"":`<button class="btn pri" id="m-nueva">Nueva solicitud</button>`}</div>
 <div id="av-ban"></div>
 ${P.length?`<div class="panel bandeja"><h3>Mis pendientes <span class="chip warn">${P.length}</span></h3>${P.slice(0,12).map(pendItem).join("")}</div>`:`<div class="panel bandeja vacia"><span class="muted">No tienes pendientes. 👍</span></div>`}
 <div class="filtros">${filtros.map(([k,t])=>`<button class="fbtn${f.est===k?" on":""}" data-f="${k}">${t} <b>${base.filter(([,o])=>pasa(o,k)).length}</b></button>`).join("")}</div>
 <div class="tools"><input class="inp" id="m-q" placeholder="Número, equipo, descripción, persona…" value="${esc(f.q)}"></div>
 <p class="count">${rows.length} solicitud${rows.length===1?"":"es"}</p>
 ${rows.length?`<div class="panel" style="padding:0"><table class="lista"><thead><tr><th>Número</th><th>Equipo o lugar</th><th>Descripción</th><th>Pidió</th><th>Prioridad</th><th>Estado</th></tr></thead><tbody>${lim.map(fila).join("")}</tbody></table>
 <div class="cards">${lim.map(card).join("")}</div></div>${rows.length>lim.length?`<button class="btn mas" id="m-mas">Ver más</button>`:""}`:`<div class="panel empty">No hay solicitudes con este filtro.</div>`}`}
function bindSol(){const v=$("#view");if(!$("#m-q"))return;
 v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.fs.est=b.dataset.f;S.limS=60;render()});
 $("#m-q").oninput=e=>{S.fs.q=e.target.value;clearTimeout(S.qT);S.qT=setTimeout(()=>{const p=e.target.selectionStart;render();const i=$("#m-q");i.focus();i.setSelectionRange(p,p)},250)};
 v.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>dlgOrden(x.dataset.o));v.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>abrirPend(x.dataset.p));
 if($("#m-nueva"))$("#m-nueva").onclick=()=>dlgNueva();if($("#m-mas"))$("#m-mas").onclick=()=>{S.limS+=60;render()}}

/* Nueva solicitud: equipo del catálogo o lugar libre */
function dlgNueva(eqPre){const L=[...eqs()].filter(([,e])=>e.estado!=="baja").sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre,"es"));
 const cc=centros().filter(c=>c.activo!==false);const pe=eqPre?eqs().get(eqPre):null;
 abrir("Nueva solicitud de mantenimiento",`<div class="fgrid">

/* ---------- Lectura de ficha técnica (PDF digital). El archivo no se guarda. ---------- */
let pdfP=null;
const cargarPDF=()=>pdfP||(pdfP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};s.onerror=()=>{pdfP=null;rej({message:"No se pudo cargar el lector de PDF. Revisa la conexión."})};document.head.appendChild(s)}));
async function textoPDF(file){if(file.size>25e6)throw{message:"El PDF es muy pesado (más de 25 MB)."};const L=await cargarPDF();
 const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let t="";
 for(let i=1;i<=Math.min(doc.numPages,8);i++){const c=await(await doc.getPage(i)).getTextContent();for(const it of c.items)t+=it.str+(it.hasEOL?"\n":" ")}
 t=t.replace(/[ \t]+/g," ");if(t.replace(/\s/g,"").length<40)throw{message:"Este PDF parece una foto o un escaneo y no tiene texto para leer. Escribe los datos a mano."};return t}
function leerFicha(t){const r={},L=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
 const ROT={marca:/^(marca|fabricante|brand|manufacturer|make)\b/i,modelo:/^(modelo|model|referencia|ref\.?)\b/i,serie:/^(n[uú]mero de serie|no\.? ?de serie|serie|serial(?: number| no\.?)?|s\/n|sn)\b/i,
  potencia:/^(potencia|power|hp|kw)\b/i,voltaje:/^(voltaje|tensi[oó]n|voltage|volt(?:s|ios)?|alimentaci[oó]n)\b/i,capacidad:/^(capacidad|capacity|caudal|flow|volumen)\b/i};
 const limpiar=v=>v.replace(/^[\s:.\-#=|]+/,"").split(/\s{2,}|\s\|\s/)[0].replace(/[\s;,]+$/,"").trim().slice(0,60);
 const esRot=v=>Object.values(ROT).some(re=>re.test(v));
 for(let i=0;i<L.length;i++)for(const[k,re]of Object.entries(ROT)){if(r[k])continue;const m=L[i].match(re);if(!m)continue;
  let v=limpiar(L[i].slice(m[0].length));if((!v||v.length<2)&&L[i+1]&&!esRot(L[i+1]))v=limpiar(L[i+1]);
  if(v&&v.length>=2&&!esRot(v)&&/[a-z0-9]/i.test(v))r[k]=v}
 if(!r.potencia){const m=t.match(/\b(\d+(?:[.,]\d+)?)\s*(hp|kw|cv)\b/i);if(m)r.potencia=m[1]+" "+m[2].toUpperCase()}
 if(!r.voltaje){const m=t.match(/\b(\d{3}(?:\s*\/\s*\d{3})?)\s*(v|vac|volt(?:s|ios)?)\b/i);if(m)r.voltaje=m[1].replace(/\s/g,"")+" V"}
 for(const k of["potencia","voltaje","capacidad"])if(r[k]&&!/\d/.test(r[k]))delete r[k];
 return r}

function vInv(){const w=cargando(COLM.inv,COLM.mov,COLM.pre,COLM.ord);if(w)return w;const f=S.inv,ST=stock();const all=[...items()].filter(([,i])=>i.activo!==false);
 const tab=f.tab;const pre=[...DB.docs(COLM.pre)].filter(([,p])=>!p.devuelto).sort((a,b)=>a[1].fecha.localeCompare(b[1].fecha));
 const rows=all.filter(([k,i])=>(tab==="prestamos"?false:i.tipo===(tab==="herr"?"herramienta":"insumo")||(!i.tipo&&tab==="ins"))&&(f.f!=="bajo"||ST.get(k)?.bajo)&&coincide(`${k} ${i.nombre} ${i.ubic||""}`,f.q)).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre,"es"));
 const nb=all.filter(([k])=>ST.get(k)?.bajo).length;
 return`<div class="row hrow"><h2 style="color:var(--brand)">Inventario de mantenimiento</h2><span class="spacer"></span>${S.gestion?'<button class="btn" id="i-ent">Registrar entrada</button><button class="btn pri" id="i-nuevo">Nuevo ítem</button>':""}</div>
 <div class="tabs"><button class="tab${tab==="ins"?" on":""}" data-t="ins">Insumos</button><button class="tab${tab==="herr"?" on":""}" data-t="herr">Herramientas</button><button class="tab${tab==="prestamos"?" on":""}" data-t="prestamos">Préstamos (${pre.length})</button></div>
 ${tab==="prestamos"?`<div class="panel">${pre.length?pre.map(([id,p])=>`<div class="cr-it"><div class="cr-t"><b>${esc(items().get(p.item)?.nombre||p.item)}</b> × ${p.cant||1}<span class="sub">Lo tiene ${esc(persona(p.a))} desde el ${fh(p.fecha)} · prestó ${esc(persona(p.por))}${p.nota?" · "+esc(p.nota):""}</span></div>${S.gestion||S.rol==="tecnico"?`<button class="btn sm" data-dev="${id}">Devolver</button>`:""}</div>`).join(""):'<p class="muted">No hay herramientas prestadas.</p>'}</div>`
 :`<div class="filtros"><button class="fbtn${f.f!=="bajo"?" on":""}" data-ff="">Todos</button><button class="fbtn${f.f==="bajo"?" on":""}" data-ff="bajo">Bajo el mínimo <b>${nb}</b></button></div>
 <div class="tools"><input class="inp" id="i-q" placeholder="Buscar…" value="${esc(f.q)}"></div>
 <div class="panel" style="padding:0">${rows.length?`<table class="lista"><thead><tr><th>Código</th><th>${tab==="herr"?"Herramienta":"Insumo"}</th><th>Existencia</th>${tab==="herr"?"<th>Prestadas</th><th>Disponibles</th>":"<th>Mínimo</th>"}</tr></thead><tbody>${rows.map(([k,i])=>{const s=ST.get(k)||{};return`<tr data-i="${k}"><td class="mono"><b>${k}</b></td><td>${esc(i.nombre)}<span class="sub">${esc(i.ubic||"")}</span></td><td class="mono">${fmtN(s.exist||0)} ${esc(i.unidad||"")}${s.bajo?' <span class="chip bad">Bajo</span>':""}</td>${tab==="herr"?`<td class="mono">${s.prest||0}</td><td class="mono">${fmtN(s.disp||0)}</td>`:`<td class="mono">${i.minimo??"—"}</td>`}</tr>`}).join("")}</tbody></table>
 <div class="cards">${rows.map(([k,i])=>{const s=ST.get(k)||{};return`<button class="card-it" data-i="${k}"><div class="row" style="margin:0"><b>${esc(i.nombre)}</b>${s.bajo?'<span class="chip bad">Bajo</span>':""}</div><span class="muted small">${k} · ${fmtN(s.disp||0)} ${esc(i.unidad||"")} disponibles${tab==="herr"&&s.prest?` · ${s.prest} prestada(s)`:""}</span></button>`}).join("")}</div>`:'<div class="empty" style="padding:18px">No hay ítems todavía.</div>'}</div>`}`}
function bindInv(){const v=$("#view"),f=S.inv;
 v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{f.tab=b.dataset.t;render()});v.querySelectorAll("[data-ff]").forEach(b=>b.onclick=()=>{f.f=b.dataset.ff;render()});
 if($("#i-q"))$("#i-q").oninput=e=>{f.q=e.target.value;clearTimeout(S.qT);S.qT=setTimeout(()=>{const p=e.target.selectionStart;render();const i=$("#i-q");i.focus();i.setSelectionRange(p,p)},250)};
 v.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>dlgItem(x.dataset.i));if($("#i-nuevo"))$("#i-nuevo").onclick=()=>dlgItem(null);if($("#i-ent"))$("#i-ent").onclick=()=>dlgMov(null);
 v.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>guardando(b,async()=>{const p=DB.docs(COLM.pre).get(b.dataset.dev);await DB.set(COLM.pre,b.dataset.dev,{...p,devuelto:{fecha:ahora(),por:ME()}});toast("Devolución registrada.");render()}))}
function dlgItem(k){const i=k?items().get(k):{nombre:"",tipo:S.inv.tab==="herr"?"herramienta":"insumo",unidad:"unidad"},G=S.gestion,dis=G?"":" disabled",s=k?stock().get(k)||{movs:[]}:{movs:[]};
 const mv=(s.movs||[]).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).slice(0,30);
 abrir(k?`${esc(k)} · ${esc(i.nombre)}`:"Nuevo ítem",`<div class="fgrid"><label class="f wide">Nombre<input class="inp" id="it-nom" value="${esc(i.nombre)}"${dis}></label>
  <label class="f">Tipo<select class="inp" id="it-tipo"${dis}><option value="insumo"${i.tipo!=="herramienta"?" selected":""}>Insumo (se gasta)</option><option value="herramienta"${i.tipo==="herramienta"?" selected":""}>Herramienta (se presta)</option></select></label>
  <label class="f">Unidad<input class="inp" id="it-u" value="${esc(i.unidad||"")}" list="it-ul"${dis}></label><label class="f">Mínimo<input class="inp" id="it-min" type="number" min="0" step="any" value="${i.minimo??""}"${dis}></label>
  <label class="f">Ubicación<input class="inp" id="it-ub" value="${esc(i.ubic||"")}" placeholder="Ej.: almacén planta, estante 2"${dis}></label></div>
  <datalist id="it-ul">${["unidad","litro","galón","kg","metro","caja","rollo","par","juego"].map(u=>`<option value="${u}">`).join("")}</datalist>
  ${k?`<div class="resumen"><div><b>${fmtN(s.exist||0)}</b>Existencia</div>${i.tipo==="herramienta"?`<div><b>${s.prest||0}</b>Prestadas</div>`:""}<div><b>${fmtN(s.disp||0)}</b>Disponibles</div></div>
  <h4 class="sec">Movimientos</h4>${mv.length?`<ul class="hist">${mv.map(m=>`<li>${fh(m.fecha)} · ${m.tipo==="consumo"?`Consumo en <b>${esc(m.ord)}</b>`:m.tipo==="ajuste"?"Ajuste":"Entrada"} · <b>${m.cant>0?"+":""}${fmtN(m.cant)}</b> · ${esc(persona(m.por))}${m.nota?" · "+esc(m.nota):""}</li>`).join("")}</ul>`:'<p class="muted">Sin movimientos.</p>'}`:""}`,
 `${k&&G?'<button class="btn izq" id="it-mov">Entrada o ajuste</button>':""}${k&&i.tipo==="herramienta"&&(G||S.rol==="tecnico")?'<button class="btn" id="it-pre">Prestar</button>':""}<button class="btn" data-cerrar>${G?"Cancelar":"Cerrar"}</button>${G?'<button class="btn pri" id="it-ok">Guardar</button>':""}`);
 if($("#it-mov"))$("#it-mov").onclick=()=>dlgMov(k);if($("#it-pre"))$("#it-pre").onclick=()=>dlgPrestar(k);
 if($("#it-ok"))$("#it-ok").onclick=ev=>guardando(ev.target,async()=>{const nom=$("#it-nom").value.trim();if(!nom)throw{message:"Escribe el nombre."};
  const d={...i,nombre:nom,tipo:$("#it-tipo").value,unidad:$("#it-u").value.trim()||"unidad"};const mn=$("#it-min").value;if(mn!=="")d.minimo=+mn;else delete d.minimo;const ub=$("#it-ub").value.trim();if(ub)d.ubic=ub;else delete d.ubic;
  let id=k;if(!id){let m=0;for(const x of items().keys())m=Math.max(m,+x.replace(/\D/g,"")||0);id="IN-"+String(m+1).padStart(3,"0")}await DB.set(COLM.inv,id,d);dlg.close();toast(k?"Ítem actualizado.":`Ítem ${id} creado.`);render()})}
function dlgMov(k){const L=[...items()].filter(([,i])=>i.activo!==false).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre,"es"));
 abrir("Entrada o ajuste de inventario",`<label class="f">Ítem<select class="inp" id="mv-i">${L.map(([id,i])=>`<option value="${id}"${id===k?" selected":""}>${esc(i.nombre)} (${esc(i.unidad||"")})</option>`).join("")}</select></label>
 <div class="seg2" style="margin:10px 0"><label><input type="radio" name="mv-t" value="entrada" checked> Entrada (compra o donación)</label><label><input type="radio" name="mv-t" value="ajuste"> Ajuste por conteo (+ o −)</label></div>
 <div class="fgrid"><label class="f">Cantidad<input class="inp" id="mv-c" type="number" step="any"></label><label class="f wide">Nota<input class="inp" id="mv-n" placeholder="Ej.: pedido ORD-0123, conteo físico"></label></div>`,
 `<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="mv-ok">Registrar</button>`);
 $("#mv-ok").onclick=ev=>guardando(ev.target,async()=>{const it=$("#mv-i").value,t=dlg.querySelector('[name="mv-t"]:checked').value,c=+$("#mv-c").value;if(!it||!c||(t==="entrada"&&c<0))throw{message:"Escribe una cantidad válida."};
  const id="MV-"+Date.now().toString(36).toUpperCase();const d={item:it,tipo:t,cant:c,fecha:ahora(),por:ME()};const n=$("#mv-n").value.trim();if(n)d.nota=n;await DB.set(COLM.mov,id,d);dlg.close();toast("Movimiento registrado.");render()})}
function dlgPrestar(k){const i=items().get(k),s=stock().get(k)||{};if((s.disp||0)<=0){toast("No hay unidades disponibles de esta herramienta.",4000);return}
 abrir(`Prestar · ${esc(i.nombre)}`,`<label class="f">¿Quién la recibe?<select class="inp" id="pr-a">${[...S.equipo.values()].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(p=>`<option value="${esc(p.email)}"${p.email===ME()?" selected":""}>${esc(p.nombre)}</option>`).join("")}</select></label>
 <div class="fgrid" style="margin-top:10px"><label class="f">Cantidad<input class="inp" id="pr-c" type="number" min="1" max="${s.disp}" value="1"></label><label class="f wide">Para qué (opcional)<input class="inp" id="pr-n" placeholder="Ej.: MT-0012"></label></div>`,
 `<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="pr-ok">Registrar préstamo</button>`);
 $("#pr-ok").onclick=ev=>guardando(ev.target,async()=>{const c=+$("#pr-c").value;if(!(c>0)||c>s.disp)throw{message:`Puedes prestar hasta ${s.disp}.`};const d={item:k,a:$("#pr-a").value,cant:c,por:ME(),fecha:ahora()};const n=$("#pr-n").value.trim();if(n)d.nota=n;
  await DB.set(COLM.pre,"PR-"+Date.now().toString(36).toUpperCase(),d);dlg.close();toast("Préstamo registrado.");render()})}

function abrir(titulo,cuerpo,pie){const tt=toast.el,tin=tt&&dlg.contains(tt);dlg.innerHTML=`<div class="dlg-h"><h3>${titulo}</h3><button class="x" aria-label="Cerrar" data-cerrar>×</button></div><div class="dlg-b">${cuerpo}</div>${pie?`<div class="dlg-f">${pie}</div>`:""}`;
 if(tin)dlg.appendChild(tt);dlg.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=()=>dlg.close());if(!dlg.open)dlg.showModal()}
async function guardando(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent="Guardando…";try{await fn()}catch(e){toast(e.message||"No se pudo guardar.",5000)}finally{btn.disabled=false;btn.textContent=t}}
function pedir(titulo,label){return new Promise(res=>{const d=$("#dlg2");d.innerHTML=`<div class="dlg-h"><h3>${esc(titulo)}</h3></div><div class="dlg-b"><label class="f">${esc(label)}<textarea id="p2-t"></textarea></label></div>
 <div class="dlg-f"><button class="btn" id="p2-no">Cancelar</button><button class="btn pri" id="p2-si">Aceptar</button></div>`;let r=null;
 $("#p2-no").onclick=()=>d.close();$("#p2-si").onclick=()=>{const v=$("#p2-t").value.trim();if(!v){$("#p2-t").focus();return}r=v;d.close()};d.onclose=()=>res(r);d.showModal();$("#p2-t").focus()})}
function abrirDoc(html,titulo){const w=window.open("","_blank");if(w){w.document.open();w.document.write(html);w.document.close();return}
 /* Si el navegador no deja abrir otra ventana, se muestra aquí mismo */
 const d=$("#dlg2");d.innerHTML=`<div class="dlg-h"><h3>${esc(titulo)}</h3><button class="x" id="d2x" aria-label="Cerrar">×</button></div><iframe class="doc-f" title="${esc(titulo)}"></iframe>`;d.classList.add("doc");
 d.querySelector("iframe").srcdoc=html;$("#d2x").onclick=()=>d.close();d.onclose=()=>d.classList.remove("doc");d.showModal()}
/* ===== Avisos de la app (notificaciones al celular o PC, aunque la app esté cerrada) ===== */
const AV={pub:"BByXhC1kCP3BUeE2hIszSsv1AEiZNOltUbNCuInjPW_EN-YeqBmeo2r5DQwMP6Qvndi7FonVttlgbYb0GK-lWyE",
 ok(){return"serviceWorker"in navigator&&"PushManager"in window&&"Notification"in window},
 ios(){return/iphone|ipad|ipod/i.test(navigator.userAgent)},
 inst(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true},
 key(){const s=AV.pub.replace(/-/g,"+").replace(/_/g,"/"),b=atob(s+"===".slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))},
 reg(){return navigator.serviceWorker.register("sw.js")},
 async estado(){if(!AV.ok())return AV.ios()&&!AV.inst()?"ios":"no";if(Notification.permission==="denied")return"bloqueado";
  const r=await navigator.serviceWorker.getRegistration();const s=r&&await r.pushManager.getSubscription();return s&&Notification.permission==="granted"?"activo":"inactivo"},
 async guardar(cli,email,s){const j=s.toJSON(),h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(j.endpoint)),id=[...new Uint8Array(h)].slice(0,12).map(x=>x.toString(16).padStart(2,"0")).join("");
  const{error}=await cli.from("documentos").upsert({coleccion:"avisos_equipos",id,data:{email:String(email).toLowerCase(),endpoint:j.endpoint,keys:j.keys,equipo:navigator.userAgent.slice(0,160),fecha:new Date().toISOString().slice(0,10)}});if(error)throw error},
 async activar(cli,email){if(!AV.ok())throw{message:AV.ios()?"En iPhone: agrega la app a la pantalla de inicio y ábrela desde el ícono.":"Este navegador no permite avisos."};
  const p=await Notification.requestPermission();if(p!=="granted")throw{message:"No se dio permiso para los avisos. Puedes activarlo en los ajustes del navegador o del teléfono."};
  const r=await AV.reg();await navigator.serviceWorker.ready;const sub=()=>r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:AV.key()});
  let s=await r.pushManager.getSubscription()||await sub();
  try{await AV.guardar(cli,email,s)}catch(e){/* el equipo estaba registrado a nombre de otra persona: se crea uno nuevo */await s.unsubscribe();s=await sub();await AV.guardar(cli,email,s)}
  try{localStorage.setItem("belmira:av:"+String(email).toLowerCase(),new Date().toISOString().slice(0,7))}catch(e){}},
 async iniciar(cli,email){if(!AV.ok())return;navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.belmira==="abrir")location.href=e.data.url});
  try{if(Notification.permission!=="granted")return;const r=await AV.reg();const s=await r.pushManager.getSubscription();if(!s)return;
   const k="belmira:av:"+String(email).toLowerCase(),m=new Date().toISOString().slice(0,7);if(localStorage.getItem(k)!==m){await AV.guardar(cli,email,s);localStorage.setItem(k,m)}}catch(e){}},
 async pintar(cli,email,aviso){const b=document.getElementById("av-ban");if(!b)return;let e;try{e=await AV.estado()}catch(x){return}
  let no=0;try{no=+localStorage.getItem("belmira:av-no")||0}catch(x){}
  if(!["inactivo","ios"].includes(e)||Date.now()-no<14*864e5){b.innerHTML="";return}
  b.innerHTML=e==="ios"?'<div class="av-ban"><div><b>Avisos en iPhone</b><span>Para recibir notificaciones, agrega la app a la pantalla de inicio (botón Compartir › Agregar a inicio) y ábrela desde ese ícono.</span></div><button type="button" class="btn" id="av-no">Entendido</button></div>'
   :'<div class="av-ban"><div><b>Recibe avisos en este equipo</b><span>Te llega una notificación cuando tengas un pendiente nuevo, aunque la app esté cerrada.</span></div><button type="button" class="btn pri" id="av-si">Activar avisos</button><button type="button" class="btn" id="av-no">Ahora no</button></div>';
  const n=document.getElementById("av-no");if(n)n.onclick=()=>{try{localStorage.setItem("belmira:av-no",String(Date.now()))}catch(x){}b.innerHTML=""};
  const s=document.getElementById("av-si");if(s)s.onclick=async()=>{s.disabled=true;s.textContent="Activando…";try{await AV.activar(cli,email);b.innerHTML="";aviso("Avisos activados en este equipo.")}catch(x){s.disabled=false;s.textContent="Activar avisos";aviso(x.message||"No se pudieron activar los avisos.")}}}};
async function init(){$("#bell").onclick=verPendientes;
 if(!window.supabase){$("#view").innerHTML='<div class="panel empty">No se pudo cargar la conexión. Revisa la señal y recarga la página.</div>';return}
 const sb=supabase.createClient(CONFIG.url,CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const{data}=await sb.auth.getSession();
 if(!data.session){try{sessionStorage.setItem("belmira:volver",location.href)}catch{}location.replace("index.html");return}
 const u=data.session.user;S.me=u;S.rol=rolDe(u);
 if(!S.rol){$("#view").innerHTML='<div class="panel"><h2>Sin acceso a Mantenimiento</h2><p class="muted">Tu usuario no tiene asignado este módulo. Pide al administrador que lo revise.</p></div>';return}
 S.gestion=["admin","jefe","director"].includes(S.rol);S.staff=S.gestion||S.rol==="tecnico"||S.rol==="lector";S.sb=sb;AV.iniciar(sb,u.email);
 $("#who").innerHTML=`<b>${esc(u.user_metadata?.nombre||u.email)}</b>${esc(ROLM[S.rol]||S.rol)}`;
 DB=makeDb(sb);
 try{const{data:eq}=await sb.rpc("personal_mant");for(const x of eq||[])S.equipo.set(x.email.toLowerCase(),{...x,email:x.email.toLowerCase()})}catch{}
 for(const c of [COLM.ord,COLM.eq,"compras_config",...(S.staff?[COLM.inv,COLM.mov,COLM.pre,COLM.cfg]:[])])DB.on(c,()=>{if(!dlg.open)render();abrirPendiente()});
 ir();abrirPendiente()}
function rolDe(u){const am=u?.app_metadata||{};return am.rol==="admin"?"admin":(am.modulos&&am.modulos.mantenimiento)||""}
function abrirPendiente(){if(S.abrir&&DB&&DB.listo(COLM.ord)&&DB.listo(COLM.eq)){const id=S.abrir;S.abrir=null;if(ords().has(id))dlgOrden(id);else toast(`No encontré la solicitud ${id} o no tienes acceso a ella.`,5000)}}
init();
})();
